<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eon Status</title>
<meta name="description" content="Live status of eon: player app, owner app, check-in and court TV.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'%3E%3Cpath d='M151.25 20C167.5 20 180 30 180 50C180 90 130 90 100 50C70 10 20 10 20 50C20 90 70 90 100 50C115 30 135 20 151.25 20' fill='none' stroke='%231D1A17' stroke-width='16'/%3E%3Ccircle cx='151.25' cy='20' r='14' fill='%23FE6E00'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfaf8; --card: #ffffff; --ink: #1d1a17; --muted: #797067; --line: #ebe7e2;
    --ok: #10b981; --ok-bg: #e9f8f1; --warn: #f59e0b; --warn-bg: #fff6e5; --bad: #ef4444; --bad-bg: #fdecec; --none: #e5e1dc;
    --orange: #fe6e00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 28px 0 32px; }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
  .logo svg { height: 26px; width: auto; display: block; }
  .logo span { font-weight: 600; color: var(--muted); font-size: 15px; padding-left: 10px; border-left: 1px solid var(--line); }
  .subscribe { font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
  .banner { display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-radius: 14px; font-weight: 700; font-size: 18px; color: #fff; background: var(--ok); }
  .banner.warn { background: var(--warn); } .banner.bad { background: var(--bad); } .banner.unknown { background: #8a8178; }
  .banner .ic { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-size: 16px; flex: none; }
  .banner small { display: block; font-weight: 500; font-size: 13px; opacity: .9; margin-top: 2px; }
  .card { margin-top: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: 15px; }
  .card-head span { font-size: 13px; color: var(--muted); }
  .comp { padding: 18px 22px; border-bottom: 1px solid var(--line); }
  .comp:last-child { border-bottom: 0; }
  .comp-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .comp-name { font-weight: 600; font-size: 15px; }
  .comp-name small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .state { font-size: 13px; font-weight: 600; color: var(--ok); white-space: nowrap; }
  .state.warn { color: var(--warn); } .state.bad { color: var(--bad); } .state.unknown { color: var(--muted); }
  .bars { display: flex; gap: 2px; height: 32px; }
  .bars i { flex: 1; border-radius: 2px; background: var(--ok); position: relative; }
  .bars i.warn { background: var(--warn); } .bars i.bad { background: var(--bad); } .bars i.none { background: var(--none); }
  .bars i:hover { opacity: .75; }
  .bars i:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: #fff; font-size: 12px; font-style: normal; padding: 5px 8px; border-radius: 6px; z-index: 2; }
  .legend { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend b { color: var(--ink); font-weight: 600; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); }
  .metric { padding: 18px 22px; border-right: 1px solid var(--line); }
  .metric:last-child { border-right: 0; }
  .metric b { display: block; font-size: 22px; letter-spacing: -0.01em; }
  .metric span { font-size: 13px; color: var(--muted); }
  .incident { padding: 18px 22px; border-bottom: 1px solid var(--line); }
  .incident:last-child { border-bottom: 0; }
  .incident h3 { margin: 0 0 4px; font-size: 15px; }
  .incident h3 em { font-style: normal; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 6px; background: var(--ok-bg); color: #0a7a48; vertical-align: 1px; }
  .incident h3 em.maint { background: #eef2ff; color: #4338ca; }
  .incident p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .incident time { display: block; margin-top: 6px; font-size: 12px; color: #a39a91; }
  .empty { padding: 18px 22px; color: var(--muted); font-size: 14px; }
  footer { margin-top: 36px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); }
  @media (max-width: 600px) {
    header { padding: 20px 0 22px; }
    .logo span { display: none; }
    .banner { font-size: 16px; padding: 16px 18px; }
    .comp, .card-head, .incident, .metric { padding-left: 16px; padding-right: 16px; }
    .bars { height: 28px; gap: 1px; }
    .metrics { grid-template-columns: 1fr; }
    .metric { border-right: 0; border-bottom: 1px solid var(--line); }
    .metric:last-child { border-bottom: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#" aria-label="eon status">
      <svg viewBox="8 0 484 100" aria-hidden="true">
        <path d="M151.25 20C167.5 20 180 30 180 50C180 90 130 90 100 50C70 10 20 10 20 50C20 90 70 90 100 50C115 30 135 20 151.25 20" fill="none" stroke="currentColor" stroke-width="16"/>
        <circle cx="151.25" cy="20" r="17.5" fill="#fbfaf8"/><circle cx="151.25" cy="20" r="14" fill="#FE6E00"/>
        <rect x="217.5" y="11" width="3" height="78" fill="currentColor" opacity=".3"/>
        <g transform="translate(248.8864 13.92) scale(0.7216)" fill="none" stroke="currentColor" stroke-width="22">
          <path d="M11 50H89A39 39 0 1 0 77.6 77.6"/><path d="M166 11A39 39 0 1 1 165.99 11"/><path d="M243 0V100M243 50A39 39 0 0 1 321 50V100"/>
        </g>
      </svg>
      <span>Status</span>
    </a>
    <a class="subscribe" id="subscribe" href="#">Get updates</a>
  </header>

  <section class="banner" id="banner"><span class="ic">✓</span><div>All systems operational<small id="checked">Checking…</small></div></section>

  <section class="card">
    <div class="card-head"><h2>Services</h2><span>Uptime over the last 90 days</span></div>
    <div id="components"></div>
  </section>

  <section class="card metrics" id="metrics"></section>

  <section class="card">
    <div class="card-head"><h2>Past incidents</h2><span>Last 90 days</span></div>
    <div id="incidents"></div>
  </section>

  <footer>
    <span>eon · fair open play for pickleball clubs</span>
    <span id="source">Checked every 5 minutes</span>
  </footer>
</div>

<script>
/*
 * Live data from UptimeRobot (free). Paste a READ-ONLY *monitor* API key below (UptimeRobot → Integrations & API →
 * Monitor-specific API keys). A read-only monitor key can only read this one monitor's up/down history, so it is
 * safe in a public page. With no key, the page shows sample data (for previews).
 */
const UPTIMEROBOT_KEY = '';
const SUBSCRIBE_URL = ''; // e.g. your club owners' Messenger group or an email link

// Every part of eon runs together, so they share one check; listed separately so clubs recognise them.
const COMPONENTS = [
  { name: 'Player app', note: 'Check-in, your court, "I\'m coming"' },
  { name: 'Owner app', note: 'Courts, queue, results, Autopilot' },
  { name: 'Court TV', note: 'Live scoreboards' },
  { name: 'Phone alerts', note: '"Court 3 is yours" notifications' },
];
const DAYS = 90;
const DAY = 86400000;

const $ = (id) => document.getElementById(id);
const fmtDate = (ms) => new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
const fmtDur = (s) => (s < 60 ? `${Math.max(1, Math.round(s))} sec` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`);

function sample() {
  const now = Date.now();
  const logs = [
    { type: 1, datetime: (now - 12 * DAY) / 1000, duration: 14 * 60 },
    { type: 1, datetime: (now - 37 * DAY) / 1000, duration: 50 },
    { type: 1, datetime: (now - 63 * DAY) / 1000, duration: 6 * 60 },
  ];
  return { status: 2, logs, since: now - 120 * DAY, sample: true, maint: [{ at: now - 25 * DAY, minutes: 3 }] };
}

async function live() {
  const body = new URLSearchParams({ api_key: UPTIMEROBOT_KEY, format: 'json', logs: '1', logs_limit: '100', custom_uptime_ratios: '90' });
  const r = await fetch('https://api.uptimerobot.com/v2/getMonitors', { method: 'POST', body });
  const j = await r.json();
  const m = j.monitors && j.monitors[0];
  if (!m) throw new Error('no monitor');
  return { status: m.status, logs: (m.logs || []).filter((l) => l.type === 1), since: m.create_datetime * 1000, maint: [] };
}

function render(d) {
  const now = Date.now();
  // Banner: 2 = up, 8/9 = down (UptimeRobot), 0/1 = paused or not checked yet.
  const banner = $('banner');
  const up = d.status === 2, down = d.status === 8 || d.status === 9;
  banner.className = 'banner' + (up ? '' : down ? ' bad' : ' unknown');
  banner.querySelector('.ic').textContent = up ? '✓' : down ? '!' : '?';
  banner.querySelector('div').firstChild.textContent = up ? 'All systems operational' : down ? 'Service interruption' : 'Status unavailable';
  $('checked').textContent = (up ? 'eon is working normally. ' : down ? 'We\'re aware and working on it. Your spot in line is safe. ' : '') + `Checked ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;

  // Downtime per day, for the 90 bars.
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const down = new Array(DAYS).fill(0);
  for (const l of d.logs) {
    const t = l.datetime * 1000;
    const idx = DAYS - 1 - Math.floor((start.getTime() + DAY - t) / DAY);
    if (idx >= 0 && idx < DAYS) down[idx] += l.duration;
  }
  const totalDown = down.reduce((a, b) => a + b, 0);
  const tracked = Math.min(DAYS, Math.ceil((now - d.since) / DAY));
  const uptime = Math.max(0, 100 - (totalDown / (tracked * 86400)) * 100);

  const bars = down.map((s, i) => {
    const day = start.getTime() - (DAYS - 1 - i) * DAY;
    const before = i < DAYS - tracked;
    const cls = before ? 'none' : s === 0 ? '' : s < 15 * 60 ? 'warn' : 'bad';
    const tip = before ? `${fmtDate(day)} · no data` : s === 0 ? `${fmtDate(day)} · no issues` : `${fmtDate(day)} · down ${fmtDur(s)}`;
    return `<i class="${cls}" data-tip="${tip}"></i>`;
  }).join('');
  const state = up ? ['', 'Operational'] : down ? ['bad', 'Interrupted'] : ['unknown', 'Unknown'];
  $('components').innerHTML = COMPONENTS.map((c) => `
    <div class="comp">
      <div class="comp-top"><div class="comp-name">${c.name}<small>${c.note}</small></div><span class="state ${state[0]}">${state[1]}</span></div>
      <div class="bars">${bars}</div>
      <div class="legend"><span>${DAYS} days ago</span><span><b>${uptime.toFixed(2)}%</b> uptime</span><span>Today</span></div>
    </div>`).join('');

  const incidents = d.logs.filter((l) => now - l.datetime * 1000 < DAYS * DAY).sort((a, b) => b.datetime - a.datetime);
  const longest = incidents.reduce((a, l) => Math.max(a, l.duration), 0);
  $('metrics').innerHTML = `
    <div class="metric"><b>${uptime.toFixed(2)}%</b><span>Uptime, last 90 days</span></div>
    <div class="metric"><b>${incidents.length}</b><span>Incidents, last 90 days</span></div>
    <div class="metric"><b>${longest ? fmtDur(longest) : '—'}</b><span>Longest interruption</span></div>`;

  // Past incidents: plain words only ("Service interruption"), never the cause.
  const items = [
    ...incidents.map((l) => ({ at: l.datetime * 1000, html: `<h3>Service interruption<em>Resolved</em></h3><p>eon was briefly unavailable for some players and clubs. Service was restored and is working normally.</p><time>${fmtDate(l.datetime * 1000)} · ${fmtDur(l.duration)}</time>` })),
    ...d.maint.map((m) => ({ at: m.at, html: `<h3>Scheduled maintenance<em class="maint">Completed</em></h3><p>We updated eon with improvements. It was unavailable for a few minutes.</p><time>${fmtDate(m.at)} · ${m.minutes} min</time>` })),
  ].sort((a, b) => b.at - a.at);
  $('incidents').innerHTML = items.length ? items.map((x) => `<div class="incident">${x.html}</div>`).join('') : '<div class="empty">No incidents in the last 90 days.</div>';
  $('source').textContent = d.sample ? 'Sample data (preview)' : 'Checked every 5 minutes';
}

const sub = $('subscribe');
if (SUBSCRIBE_URL) sub.href = SUBSCRIBE_URL; else sub.style.display = 'none';
(UPTIMEROBOT_KEY ? live() : Promise.resolve(sample())).then(render, () => render({ status: 0, logs: [], since: Date.now(), maint: [] }));
if (UPTIMEROBOT_KEY) setInterval(() => live().then(render, () => {}), 60000);
</script>
</body>
</html>
